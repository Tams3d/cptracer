name: Bug report
description: Report a reproducible problem with the dashboard.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Never paste API keys or other secrets. Handles are public, but omit them if you prefer.

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the result you expected and the result you saw.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the dashboard.
        2. Save a Codeforces handle.
        3. Select the 3M trend range.
        4. Observe the wrong value.
    validations:
      required: true

  - type: dropdown
    id: route
    attributes:
      label: Route
      options:
        - Dashboard (/)
        - Profile (/profile/)
        - About (/about/)
        - Another route or endpoint
    validations:
      required: true

  - type: dropdown
    id: theme
    attributes:
      label: Theme
      options:
        - Light
        - Dark
        - System
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Firefox 145 on Windows 11
    validations:
      required: true

  - type: textarea
    id: console
    attributes:
      label: Console output
      description: Paste relevant errors from the browser console, if any.
      render: shell
    validations:
      required: false
